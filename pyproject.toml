[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hello-shinrai"
version = "0.1.2"
description = "Local ShinrAI playground and transparent debugging workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Innovius"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "botocore>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
hello-shinrai = "hello_shinrai.cli:main"

[project.urls]
Homepage = "https://github.com/Innovius-ai/hello-shinrai"
Documentation = "https://shinrai.innovius.io/docs#hello-shinrai"
Issues = "https://github.com/Innovius-ai/hello-shinrai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_shinrai"]

[tool.hatch.build.targets.sdist]
include = ["src/hello_shinrai", "tests", "README.md", "LICENSE", "NOTICE", "Dockerfile", "requirements.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
